name: CI

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Debug

      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure

      - name: Install
        run: cmake --install build --config Debug --prefix install-root

      - name: Smoke test the installed binary
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Windows) install-root/bin/nanox.exe --help ;;
            *)       install-root/bin/nanox --help ;;
          esac
